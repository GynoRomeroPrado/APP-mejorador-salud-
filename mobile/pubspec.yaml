name: health_fitness_app
description: A comprehensive health and fitness application with medication reminders, workout tracking, and AI-powered recommendations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # Backend & Database
  supabase_flutter: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  firebase_auth: ^4.15.3
  firebase_core: ^2.24.2

  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  firebase_messaging: ^14.7.9
  permission_handler: ^11.1.0

  # Date & Time
  intl: ^0.18.1
  table_calendar: ^3.0.9
  time_picker_spinner: ^2.0.1

  # Charts & Visualization
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^24.1.41

  # Media & Camera
  image_picker: ^1.0.5
  camera: ^0.10.5+7
  video_player: ^2.8.1

  # ML & AI
  tflite_flutter: ^0.10.4
  google_ml_kit: ^0.16.3

  # Storage & Files
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path: ^1.8.3

  # Navigation
  go_router: ^12.1.3

  # Utils
  uuid: ^4.2.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  logger: ^2.0.2+1
  flutter_dotenv: ^5.1.0

  # Analytics & Monitoring
  sentry_flutter: ^7.14.0
  mixpanel_flutter: ^2.2.0

  # WebView (for articles)
  webview_flutter: ^4.4.4

  # Animations
  flutter_animate: ^4.3.0
  rive: ^0.12.4

  # QR Code (for sharing workouts)
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # Social
  share_plus: ^7.2.1
  url_launcher: ^6.2.2

  # Biometrics
  local_auth: ^2.1.8

  # Device Info
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1

  # Connectivity
  connectivity_plus: ^5.0.2

  # In-App Purchases
  in_app_purchase: ^3.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting & Code Quality
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.0.6
  isar_generator: ^3.1.0+1
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.2
  integration_test:
    sdk: flutter

  # Icons
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

# Platform-Specific Configuration
platforms:
  android:
    minSdkVersion: 21
    targetSdkVersion: 34
    compileSdkVersion: 34
  ios:
    deployment_target: '13.0'
