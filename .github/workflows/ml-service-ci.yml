name: ML Service CI/CD

on:
  push:
    branches: [main, develop, claude/**]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ml-service/**'

jobs:
  test:
    name: Test ML Service
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio black flake8 mypy

      - name: Run linter (black)
        working-directory: ml-service
        run: black --check .

      - name: Run flake8
        working-directory: ml-service
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run type checker (mypy)
        working-directory: ml-service
        run: mypy . --ignore-missing-imports
        continue-on-error: true

      - name: Run tests with coverage
        working-directory: ml-service
        env:
          ENVIRONMENT: test
          JWT_SECRET: test-secret-key
          SENTRY_DSN: ""
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./ml-service/coverage.xml
          flags: ml-service
          name: ml-service-coverage

      - name: Test API endpoint
        working-directory: ml-service
        run: |
          python main.py &
          sleep 5
          curl http://localhost:8000/health || exit 1
          kill %1

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run safety check
        working-directory: ml-service
        run: safety check --file requirements.txt
        continue-on-error: true

      - name: Run bandit security scan
        working-directory: ml-service
        run: bandit -r . -ll
        continue-on-error: true

  deploy:
    name: Deploy to Railway
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: ml-service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ml-service

      - name: Verify deployment
        run: |
          sleep 10
          curl -f ${{ secrets.ML_SERVICE_URL }}/health || exit 1

      - name: Notify deployment
        if: success()
        run: |
          echo "ML Service deployed successfully to Railway"
