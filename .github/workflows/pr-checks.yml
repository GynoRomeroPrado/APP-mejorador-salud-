name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ml-service: ${{ steps.filter.outputs.ml-service }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            ml-service:
              - 'ml-service/**'
            mobile:
              - 'mobile/**'

  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  backend-checks:
    name: Backend PR Checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linter
        working-directory: backend
        run: npm run lint

      - name: Check TypeScript
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Check for security vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=moderate

  ml-service-checks:
    name: ML Service PR Checks
    needs: changes
    if: needs.changes.outputs.ml-service == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest

      - name: Run linter
        working-directory: ml-service
        run: black --check .

      - name: Run tests
        working-directory: ml-service
        run: pytest -v

  mobile-checks:
    name: Mobile PR Checks
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze

      - name: Check formatting
        working-directory: mobile
        run: dart format --set-exit-if-changed .

      - name: Run tests
        working-directory: mobile
        run: flutter test

  size-check:
    name: Bundle Size Check
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Build base APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/base.apk

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Build PR APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/pr.apk

      - name: Compare sizes
        run: |
          base_size=$(stat -f%z /tmp/base.apk)
          pr_size=$(stat -f%z /tmp/pr.apk)
          diff=$((pr_size - base_size))
          percent=$((diff * 100 / base_size))

          echo "Base size: $(numfmt --to=iec-i --suffix=B $base_size)"
          echo "PR size: $(numfmt --to=iec-i --suffix=B $pr_size)"
          echo "Difference: $diff bytes ($percent%)"

          if [ $percent -gt 10 ]; then
            echo "⚠️ Warning: APK size increased by more than 10%"
            exit 1
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate

  pr-labeler:
    name: Auto Label PR
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Label PR
        uses: actions/labeler@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Add size labels
        uses: pascalgn/size-label-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: |
            0: XS
            10: S
            50: M
            200: L
            500: XL
            1000: XXL

  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [backend-checks, ml-service-checks, mobile-checks]
    if: always()

    steps:
      - name: Create PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('CI/CD Summary')
            );

            const output = `## 🤖 CI/CD Summary

            ### Check Results
            - Backend: ${{ needs.backend-checks.result || 'skipped' }}
            - ML Service: ${{ needs.ml-service-checks.result || 'skipped' }}
            - Mobile: ${{ needs.mobile-checks.result || 'skipped' }}

            ### Next Steps
            ${needs.backend-checks.result === 'failure' || needs.ml-service-checks.result === 'failure' || needs.mobile-checks.result === 'failure' ? '⚠️ Please fix the failing checks before merging.' : '✅ All checks passed! Ready for review.'}

            ---
            *Last updated: ${new Date().toUTCString()}*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }
